schemaVersion: 2.2.2
metadata:
  name: php-hello-world
components:
  - name: developer-ww-workspace
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:3.22
      memoryLimit: '2Gi'
      memoryRequest: '1Gi'
      cpuLimit: '1'
      cpuRequest: '0.5'
      volumeMounts:
        - name: direct-nfs-mount
          path: /data
  - name: direct-nfs-mount
    kubernetes:
      inlined: |
        kind: Pod
        spec:
          containers:
            - name: developer-ww-workspace
          volumes:
            - name: direct-nfs-mount
              nfs:
                server: 192.168.1.202
                path: /nfs_share
                readOnly: false
commands:
  - id: run
    exec:
      label: "Run the application"
      component: tools
      workingDir: ${PROJECTS_ROOT}/php-hello-world
      commandLine: php hello-world.php
      group:
        kind: run
