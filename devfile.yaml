schemaVersion: 2.2.2
metadata:
  name: php-hello-world
  # We use attributes to directly patch the underlying workspace infrastructure
  attributes:
    controller.devfile.io/pod-overrides:
      spec:
        volumes:
          - name: direct-nfs-mount
            nfs:
              server: 192.168.1.202
              path: /nfs_share
              readOnly: false
components:
  - name: developer-ww-workspace
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:3.22
      memoryLimit: '2Gi'
      memoryRequest: '1Gi'
      cpuLimit: '1'
      cpuRequest: '0.5'
      # Native devfile volume mounts work seamlessly when the volume is injected via pod-overrides!
      volumeMounts:
        - name: direct-nfs-mount
          path: /data
commands:
  - id: run
    exec:
      label: "Run the application"
      component: tools
      workingDir: ${PROJECTS_ROOT}/php-hello-world
      commandLine: php hello-world.php
      group:
        kind: run
