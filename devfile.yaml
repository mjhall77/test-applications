schemaVersion: 2.2.2
metadata:
  name: php-hello-world
components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:3.22
      memoryLimit: '2Gi'
      memoryRequest: '1Gi'
      cpuLimit: '1'
      cpuRequest: '0.5'
      volumeMounts:
        - name: share-pvc
          path: /data # The path inside the container
  - name: share-pvc
    volume:
      size: 5Gi # Adjust size as needed, or it will bind to your pre-existing PVC if names match
commands:
  - id: run
    exec:
      label: "Run the application"
      component: tools
      workingDir: ${PROJECTS_ROOT}/php-hello-world
      commandLine: php hello-world.php
      group:
        kind: run
